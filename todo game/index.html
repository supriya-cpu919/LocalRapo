<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Interactive Todo Game</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#4facfe,#00f2fe);
    }

    .game-box{
      width:380px;
      background:white;
      padding:25px;
      border-radius:20px;
      box-shadow:0 10px 25px rgba(0,0,0,0.2);
    }

    h1{
      text-align:center;
      margin-bottom:20px;
      color:#333;
    }

    .score-box{
      text-align:center;
      font-size:20px;
      margin-bottom:15px;
      color:#444;
      font-weight:bold;
    }

    .input-box{
      display:flex;
      gap:10px;
    }

    .input-box input{
      flex:1;
      padding:12px;
      border:2px solid #ddd;
      border-radius:10px;
      outline:none;
      font-size:16px;
    }

    .input-box button{
      padding:12px 18px;
      border:none;
      background:#00c853;
      color:white;
      border-radius:10px;
      cursor:pointer;
      font-weight:bold;
      transition:0.3s;
    }

    .input-box button:hover{
      background:#00e676;
    }

    ul{
      list-style:none;
      margin-top:20px;
    }

    li{
      background:#f1f1f1;
      padding:12px;
      border-radius:10px;
      margin-bottom:10px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      transition:0.3s;
    }

    li.completed{
      background:#c8f7c5;
      text-decoration:line-through;
    }

    .btns button{
      margin-left:5px;
      border:none;
      padding:7px 10px;
      border-radius:7px;
      cursor:pointer;
      color:white;
    }

    .complete-btn{
      background:#2962ff;
    }

    .delete-btn{
      background:#ff1744;
    }

    .level{
      text-align:center;
      margin-top:15px;
      color:#333;
      font-weight:bold;
    }
  </style>
</head>

<body>

  <div class="game-box">

    <h1> Todo Game</h1>

    <div class="score-box">
      Score: <span id="score">0</span>
    </div>

    <div class="input-box">
      <input type="text" id="taskInput" placeholder="Enter mission...">
      <button onclick="addTask()">Add</button>
    </div>

    <ul id="taskList"></ul>

    <div class="level">
      Level: <span id="level">1</span>
    </div>

  </div>

  <script>

    let score = 0;
    let level = 1;

    function addTask(){

      let taskInput = document.getElementById("taskInput");
      let taskText = taskInput.value.trim();

      if(taskText === ""){
        alert("Enter a task!");
        return;
      }

      let li = document.createElement("li");

      li.innerHTML = `
        <span>${taskText}</span>

        <div class="btns">
          <button class="complete-btn" onclick="completeTask(this)">✔</button>

          <button class="delete-btn" onclick="deleteTask(this)">✖</button>
        </div>
      `;

      document.getElementById("taskList").appendChild(li);

      taskInput.value = "";
    }

    function completeTask(button){

      let li = button.parentElement.parentElement;

      if(!li.classList.contains("completed")){

        li.classList.add("completed");

        score += 10;

        document.getElementById("score").innerText = score;

        checkLevel();
      }
    }

    function deleteTask(button){

      let li = button.parentElement.parentElement;

      li.remove();
    }

    function checkLevel(){

      level = Math.floor(score / 50) + 1;

      document.getElementById("level").innerText = level;
    }

  </script>

</body>
</html>
